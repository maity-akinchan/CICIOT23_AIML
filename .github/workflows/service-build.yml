name: Monitoring service builds
on:
  workflow_dispatch:
  push:
    tags: ['service-v*']
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector-go/go.mod
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: scripts/build-live-service.sh
      - run: cd collector-go && CGO_ENABLED=1 go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-${{ matrix.runner }}
          path: dist/collectors/
  bundle:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: monitoring-*
          merge-multiple: true
          path: dist/collectors
      - run: cd dist/collectors && sha256sum sentinel-service-linux-* > LIVE-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-linux-bundle
          path: dist/collectors/
