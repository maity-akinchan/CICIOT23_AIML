[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sentinel-ml"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn==1.6.1", "joblib>=1.3", "dpkt==1.9.8"]
[tool.setuptools.packages.find]
include = ["sentinel_ml*"]
[tool.pytest.ini_options]
pythonpath = [".", "backend-fastapi"]
testpaths = ["backend-fastapi/tests", "tests"]
